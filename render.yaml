# The Entitled backend on Render's free plan. The frontend goes on Vercel: see DEPLOYMENT.md.
# Free has no disk, so every restart returns to fresh demo data.
services:
  - type: web
    name: entitled-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: CONFIRMATION_SECRET
        generateValue: true

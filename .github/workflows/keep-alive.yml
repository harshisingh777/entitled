# Render's free plan stops the backend after 15 idle minutes, and without a database it forgets every household
# when it does. A visit every 10 minutes keeps it awake. One service running all month fits the free 750 hours.
# GitHub may delay or skip scheduled runs when it is busy, so this lowers the chance of a sleep rather than ruling it out.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the backend and the site
        env:
          BACKEND: https://entitled-backend-khhk.onrender.com
          SITE: https://entitled-pi.vercel.app
        run: |
          # A sleeping server takes about a minute to start, so the first visit may need a few tries.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "$BACKEND/api/health"; then break; fi
            sleep 20
          done
          curl -fsS --max-time 60 "$SITE/api/health"
